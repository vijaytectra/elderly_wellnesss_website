server {
    listen 80;
    listen [::]:80;
    server_name theelderlywellness.com www.theelderlywellness.com;

    root /var/www/html/theelderlywellness.com;
    index index.html index.php;

    # Compression (helps PageSpeed text-compression audit)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        image/svg+xml
        font/woff2
        application/manifest+json;

    # Serve pre-compressed foo.css.gz / foo.js.gz when the build produces them.
    # Costs nothing if the .gz twins are absent - nginx just falls back to
    # on-the-fly gzip above. (Needs ngx_http_gzip_static_module, which is
    # compiled into the Debian/Ubuntu nginx-core / nginx-full packages.)
    gzip_static on;

    # ------------------------------------------------------------------
    # Brotli (OPTIONAL MODULE - read this before deploying)
    # ------------------------------------------------------------------
    # nginx does NOT ship brotli by default. Writing `brotli on;` directly
    # here would make nginx refuse to start ("unknown directive") on any box
    # where the module is missing - i.e. a hard outage on reload.
    #
    # So the brotli directives live in an OPTIONAL snippet pulled in by the
    # wildcard include below. A wildcard `include` whose glob matches nothing
    # is NOT an error in nginx, so if the snippet is absent the site simply
    # keeps serving gzip and starts normally.
    #
    # To ENABLE brotli on the server:
    #   1) apt-get install libnginx-mod-brotli      (Debian/Ubuntu)
    #      - this drops load_module lines into /etc/nginx/modules-enabled/
    #      - on other distros build ngx_brotli and add, at the TOP of
    #        /etc/nginx/nginx.conf (main context, before `events {`):
    #          load_module modules/ngx_http_brotli_filter_module.so;
    #          load_module modules/ngx_http_brotli_static_module.so;
    #   2) create /etc/nginx/snippets/brotli.conf containing exactly:
    #
    #        brotli on;
    #        brotli_comp_level 5;
    #        brotli_min_length 256;
    #        brotli_static on;
    #        brotli_types
    #            text/plain
    #            text/css
    #            text/javascript
    #            application/javascript
    #            application/json
    #            application/ld+json
    #            image/svg+xml
    #            font/woff2
    #            application/manifest+json;
    #
    #      (text/html is compressed by brotli unconditionally and must NOT be
    #       listed in brotli_types.)
    #   3) nginx -t && systemctl reload nginx
    #
    # If brotli is NOT available: do nothing. Leave the snippet uncreated and
    # gzip_static/gzip above continue to handle text compression on their own.
    # If nginx fails to start AFTER you add the snippet, the module is not
    # actually loaded - delete /etc/nginx/snippets/brotli.conf and reload.
    include /etc/nginx/snippets/brotli.conf*;

    # ETags let the browser revalidate cheaply with If-None-Match -> 304.
    # On by default; pinned explicitly so it survives future edits.
    etag on;

    # Baseline security headers. NOTE: add_header does NOT merge across
    # levels - the moment a location declares its own add_header, ALL
    # server-level add_header directives stop being inherited there. These
    # two are therefore repeated verbatim in every location below that sets
    # any header of its own. `always` also emits them on 301/404 responses.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Strip /index.html from URLs (clean permalinks)
    if ($request_uri ~* "^(.+)/index\.html/?$") {
        return 301 $1;
    }

    # Rescue blog posts linked without /blogs/ (e.g. /exercises-for-seniors-over-75)
    location ~ ^/(activities\-of\-daily\-living\-adls\-for\-parents|address\-loneliness\-and\-depression\-in\-senior\-citizens|age\-related\-health\-conditions|alzheimers\-and\-dementia\-care\-services\-for\-senior\-citizens|different\-ways\-to\-prevent\-osteoporosis\-in\-senior\-citizens\-for\-stronger\-bone\-health|early\-signs\-of\-dementia\-in\-elderly\-parents|elderly\-care\-services\-in\-adambakkam|elderly\-care\-services\-in\-adyar|elderly\-care\-services\-in\-alandur|elderly\-care\-services\-in\-alapakkam|elderly\-care\-services\-in\-alwarpet|elderly\-care\-services\-in\-alwarthirunagari|elderly\-care\-services\-in\-ambattur|elderly\-care\-services\-in\-chennai|essential\-care\-regarding\-arthritis\-for\-senior\-citizens\-to\-enhance\-their\-mobility\-and\-comfort|essential\-grooming\-hygiene\-tips\-elderly|exercises\-for\-seniors\-over\-75|fall\-prevention\-home\-safety\-checklist\-elderly\-chennai|finding\-the\-right\-balance\-between\-professional\-care\-and\-family\-involvement\-for\-senior\-citizens|heres\-why\-regular\-checkups\-matter\-so\-much\-for\-seniors|home\-care\-vs\-assisted\-living\-chennai|home\-modifications\-for\-elder\-safety|home\-modifications\-for\-seniors|how\-elderly\-wellness\-works|how\-proper\-meals\-and\-medication\-assistance\-improve\-senior\-health\-and\-well\-being|how\-to\-hire\-best\-caregiver\-for\-seniors\-in\-chennai|how\-to\-increase\-sodium\-levels\-in\-elderly\-at\-home|journey\-of\-eldery|loneliness\-mental\-wellbeing\-elderly\-parents|necessary\-lifestyle\-changes\-to\-prevent\-cardiovascular\-diseases\-for\-elderly\-citizens|nutritious\-diets\-for\-senior\-health|personal\-hygiene\-and\-diaper\-change\-services\-for\-senior\-citizens|post\-hospital\-recovery\-care\-at\-home\-chennai|what\-is\-caregivers|what\-is\-elderly|what\-is\-the\-importance\-of\-regular\-exercising\-for\-senior\-citizens)/?$ {
        return 301 /blogs/$1/;
    }

    # Static site (everything except /blogs/)
    # This block only ever serves HTML documents: every static asset extension
    # is claimed by the regex location further down, and in nginx a matching
    # regex location beats a prefix location. So the HTML no-cache policy is
    # applied here rather than via a `\.html$` regex, which would have had to
    # duplicate (and risk diverging from) the try_files chain below.
    # no-cache = "you may keep the copy, but revalidate every time", so a
    # deploy of new HTML goes live instantly while ETag/304 keeps it cheap.
    location / {
        try_files $uri $uri/ $uri/index.html =404;

        add_header Cache-Control "no-cache";
        # repeated: this location's own add_header suppresses inheritance
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Blogs (static HTML under /blogs/)
    location /blogs/ {
        try_files $uri $uri/ $uri/index.html /blogs/index.php?$args;

        # HTML/PHP-rendered documents - same must-revalidate policy as above.
        add_header Cache-Control "no-cache";
        # repeated: this location's own add_header suppresses inheritance
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ ^/blogs/.+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        add_header Cache-Control "no-cache";
        # repeated: this location's own add_header suppresses inheritance
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Immutable static assets, matched by extension so they never collide with
    # the try_files/blog rules above.
    #   - CSS/JS: every page loads one bundle requested as
    #     css/<page>.bundle.css?v=20260728 - the ?v= is bumped on every
    #     deploy, so the URL itself is the version and a 1-year TTL is safe.
    #   - fonts (incl. fonts/icofont-subset.woff2), images and the
    #     images/home/opt/*.mp4 hero videos are replaced by name, not edited
    #     in place, so they are equally safe to freeze.
    # `immutable` additionally tells the browser not to revalidate on reload.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4)$ {
        # `expires` supplies the legacy Expires: date; the add_header below
        # supplies the authoritative Cache-Control. Both emit a Cache-Control
        # value (same max-age, so they agree) - drop `expires 1y;` if you
        # prefer a single Cache-Control header on the wire.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # repeated: this location's own add_header suppresses inheritance
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
